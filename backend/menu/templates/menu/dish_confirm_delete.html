<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><title>Удаление - Везём</title></head>
<body>
    <h1>Удалить блюдо «{{ dish.name }}»?</h1>
    <p>Это действие нельзя отменить.</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit">Да, удалить</button>
        <a href="{% url 'menu:dish_detail' dish.pk %}">Отмена</a>
    </form>
</body>
</html>
