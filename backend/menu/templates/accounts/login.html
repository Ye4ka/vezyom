<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><title>Вход — Везём</title></head>
<body>
    {% include 'accounts/_nav.html' %}

    <h1>Вход</h1>
    <form method="post" novalidate>
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ next }}">
        {{ form.as_p }}
        <button type="submit">Войти</button>
    </form>
    <p>Нет аккаунта? <a href="{% url 'accounts:register' %}">Зарегистрироваться</a></p>
</body>
</html>
