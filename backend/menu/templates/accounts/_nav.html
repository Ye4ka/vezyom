<nav>
    <a href="{% url 'menu:dish_list' %}">Каталог</a> |
    {% if user.is_authenticated %}
        Вы вошли как <b>{{ user.profile.full_name|default:user.username }}</b>
        <form method="post" action="{% url 'accounts:logout' %}" style="display:inline">
            {% csrf_token %}
            <button type="submit">Выйти</button>
        </form>
    {% else %}
        <a href="{% url 'accounts:login' %}">Войти</a> |
        <a href="{% url 'accounts:register' %}">Регистрация</a>
    {% endif %}
</nav>
<hr>
    {% if messages %}
    <ul>{% for m in messages %}<li>{{ m }}</li>{% endfor %}</ul>
    {% endif %}
